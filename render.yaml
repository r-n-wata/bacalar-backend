services:
  - type: web
    name: bacalar-backend
    runtime: node
    rootDir: .
    buildCommand: npm ci && npm run prisma:generate && npm run build
    preDeployCommand: npm run prisma:migrate:deploy
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DEFAULT_LOCALE
        value: en
      - key: ALLOWED_ORIGINS
        sync: false
      - key: NETLIFY_SITE_NAME
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: bacalar-postgres
          property: connectionString

databases:
  - name: bacalar-postgres
    databaseName: bacalar
    user: bacalar
